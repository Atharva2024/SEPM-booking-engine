<!DOCTYPE html>
<html>
<head>
    <title>ResourceFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h1 class="mb-4">ResourceFlow Booking Engine</h1>

<div class="card p-4 mb-4">

<h4>Create Resource</h4>

<input id="name" class="form-control mb-2" placeholder="Resource Name">

<input id="category" class="form-control mb-2" placeholder="Category">

<input id="price" class="form-control mb-2" placeholder="Price per hour">

<input id="inventory" class="form-control mb-3" placeholder="Total Inventory">

<button class="btn btn-primary" onclick="createResource()">
Add Resource
</button>

</div>


<div class="card p-4">

<h4>Available Resources</h4>

<button class="btn btn-success mb-3" onclick="loadResources()">
Load Resources
</button>

<ul id="resourceList" class="list-group"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
